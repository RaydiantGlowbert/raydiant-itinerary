<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Team Raydiant Itinerary</title>
<meta name="theme-color" content="#1B1530">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; background: #1B1530; color: #FFFFFF;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 20px; -webkit-font-smoothing: antialiased;
  }
  .gate { width: 100%; max-width: 380px; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #C9BEFF; }
  h1 { margin: 8px 0 6px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 40px; line-height: 1.05; font-weight: 700; }
  p { margin: 0 0 24px; font-size: 16px; line-height: 1.45; color: #E4DEFF; }
  label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  input[type=password] {
    width: 100%; min-height: 52px; padding: 0 16px; border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.35); background: rgba(255,255,255,0.08);
    color: #FFFFFF; font: 500 17px 'Inter', system-ui, sans-serif;
  }
  input[type=password]:focus { outline: 2px solid #FFC979; outline-offset: 2px; }
  .remember { display: flex; align-items: center; gap: 10px; margin: 16px 0 20px; font-size: 15px; color: #E4DEFF; font-weight: 400; min-height: 44px; }
  .remember input { width: 20px; height: 20px; accent-color: #6D4AFF; margin: 0; }
  button {
    width: 100%; min-height: 52px; border: 0; border-radius: 999px;
    background: #6D4AFF; color: #FFFFFF; font: 600 16px 'Inter', system-ui, sans-serif; cursor: pointer;
  }
  button:focus-visible { outline: 2px solid #FFC979; outline-offset: 2px; }
  button[disabled] { opacity: 0.7; }
  .err { min-height: 22px; margin-top: 12px; font-size: 14px; color: #FFC979; }
</style>
</head>
<body>
<main class="gate">
  <div class="eyebrow">Team Raydiant</div>
  <h1>Itinerary</h1>
  <p>Enter the team password to view the schedule.</p>
  <form id="f">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required>
    <label class="remember"><input id="rem" type="checkbox" checked> Remember me on this phone</label>
    <button id="go" type="submit">Open itinerary</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</main>

var STORE = 'raydiant-itinerary-key';
function unb64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
function b64(buf) { var a = new Uint8Array(buf), s = ''; for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }

function decryptWith(key) {
  return crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(IV) }, key, unb64(DATA))
    .then(function (buf) { return new TextDecoder().decode(buf); });
}
function show(html) { document.open(); document.write(html); document.close(); }
function deriveKey(pw) {
  return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey'])
    .then(function (base) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: unb64(SALT), iterations: ITER, hash: 'SHA-256' },
        base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    });
}

// Try a remembered key first
(function () {
  var saved = null;
  try { saved = localStorage.getItem(STORE); } catch (e) {}
  if (!saved) return;
  crypto.subtle.importKey('raw', unb64(saved), 'AES-GCM', false, ['decrypt'])
    .then(decryptWith).then(show)
    .catch(function () { try { localStorage.removeItem(STORE); } catch (e) {} });
})();

document.getElementById('f').addEventListener('submit', function (e) {
  e.preventDefault();
  var btn = document.getElementById('go'), err = document.getElementById('err');
  var pw = document.getElementById('pw').value.trim();
  btn.disabled = true; btn.textContent = 'Opening…'; err.textContent = '';
  var key;
  deriveKey(pw).then(function (k) { key = k; return decryptWith(k); })
    .then(function (html) {
      if (document.getElementById('rem').checked) {
        return crypto.subtle.exportKey('raw', key).then(function (raw) {
          try { localStorage.setItem(STORE, b64(raw)); } catch (e) {}
          show(html);
        });
      }
      show(html);
    })
    .catch(function () {
      err.textContent = 'That password didn\u2019t work. Check with Lisa and try again.';
      btn.disabled = false; btn.textContent = 'Open itinerary';
      document.getElementById('pw').select();
    });
});
